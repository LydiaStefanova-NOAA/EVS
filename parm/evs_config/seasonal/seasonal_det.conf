#!/bin/bash
# Deterministic seasonal verification config
# Sourced by jobs/JEVS_PREP_SEASONAL and other seasonal steps

###############################################################################
# 1) Run-specific identity
###############################################################################
export RUN="det"

###############################################################################
# 2) Deterministic seasonal setup
###############################################################################
# Example model names for one first-pass deterministic workflow
export SEASONAL_MODELS="${SEASONAL_MODELS:-cfs gfs}"

# Example observation types
export SEASONAL_OBS="${SEASONAL_OBS:-era5 ghrsst}"

# Example seasonal lead times in months
export SEASONAL_LEADS="${SEASONAL_LEADS:-1 2 3 4 5 6}"

# Example verification domains
export SEASONAL_DOMAINS="${SEASONAL_DOMAINS:-global}"

# Example variables / predictands
export SEASONAL_PREDICTANDS="${SEASONAL_PREDICTANDS:-tmp2m precip}"

###############################################################################
# 3) Model and output paths
###############################################################################
# Keep these general and let the driver fill in the actual COMIN/COMOUT values.
export DET_MODEL_ROOT="${DET_MODEL_ROOT:-${COMIN}/seasonal/det}"
export DET_OBS_ROOT="${DET_OBS_ROOT:-${COMIN}/obs/seasonal}"

export DET_STAGE_DIR="${DET_STAGE_DIR:-${EVS_SEASONAL_WORK_ROOT}/det/stage}"
export DET_PREP_DIR="${DET_PREP_DIR:-${EVS_SEASONAL_OUT_ROOT}/det/prep}"

mkdir -p "${DET_STAGE_DIR}" "${DET_PREP_DIR}"

###############################################################################
# 4) METplus hook for deterministic verification
###############################################################################
export EVS_SEASONAL_DET_METPLUS_DIR="${EVS_SEASONAL_DET_METPLUS_DIR:-${EVS_SEASONAL_METPLUS_ROOT}/det}"
export EVS_SEASONAL_DET_METPLUS_CONF="${EVS_SEASONAL_DET_METPLUS_CONF:-${EVS_SEASONAL_DET_METPLUS_DIR}/metplus_config.conf}"

###############################################################################
# 5) Logging
###############################################################################
if [[ "${EVS_SEASONAL_VERBOSE}" == "YES" ]]; then
  echo "[seasonal_det.conf] RUN=${RUN}"
  echo "[seasonal_det.conf] SEASONAL_MODELS=${SEASONAL_MODELS}"
  echo "[seasonal_det.conf] SEASONAL_OBS=${SEASONAL_OBS}"
  echo "[seasonal_det.conf] SEASONAL_LEADS=${SEASONAL_LEADS}"
  echo "[seasonal_det.conf] SEASONAL_DOMAINS=${SEASONAL_DOMAINS}"
fi
