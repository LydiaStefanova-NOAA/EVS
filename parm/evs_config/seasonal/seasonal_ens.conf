#!/bin/bash
# Ensemble/probabilistic seasonal verification config
# Sourced by jobs/JEVS_PREP_SEASONAL and other seasonal steps

###############################################################################
# 1) Run-specific identity
###############################################################################
export RUN="ens"

###############################################################################
# 2) Ensemble seasonal setup
###############################################################################
# Example ensemble model names
export SEASONAL_MODELS="${SEASONAL_MODELS:-cfs_ens gefs}"

# Example observations for prob verification
export SEASONAL_OBS="${SEASONAL_OBS:-era5 ghrsst}"

# Ensemble lead times in months
export SEASONAL_LEADS="${SEASONAL_LEADS:-1 2 3 4 5 6}"

# Spatial domains for ensemble analysis
export SEASONAL_DOMAINS="${SEASONAL_DOMAINS:-global}"

# Variables / predictands for prob operations
export SEASONAL_PREDICTANDS="${SEASONAL_PREDICTANDS:-tmp2m precip}"

###############################################################################
# 3) Ensemble-specific runtime layout
###############################################################################
export ENS_MODEL_ROOT="${ENS_MODEL_ROOT:-${COMIN}/seasonal/ens}"
export ENS_OBS_ROOT="${ENS_OBS_ROOT:-${COMIN}/obs/seasonal}"

export ENS_STAGE_DIR="${ENS_STAGE_DIR:-${EVS_SEASONAL_WORK_ROOT}/ens/stage}"
export ENS_PREP_DIR="${ENS_PREP_DIR:-${EVS_SEASONAL_OUT_ROOT}/ens/prep}"

mkdir -p "${ENS_STAGE_DIR}" "${ENS_PREP_DIR}"

###############################################################################
# 4) METplus hook for ensemble verification
###############################################################################
export EVS_SEASONAL_ENS_METPLUS_DIR="${EVS_SEASONAL_ENS_METPLUS_DIR:-${EVS_SEASONAL_METPLUS_ROOT}/ens}"
export EVS_SEASONAL_ENS_METPLUS_CONF="${EVS_SEASONAL_ENS_METPLUS_CONF:-${EVS_SEASONAL_ENS_METPLUS_DIR}/metplus_config.conf}"

###############################################################################
# 5) Logging
###############################################################################
if [[ "${EVS_SEASONAL_VERBOSE}" == "YES" ]]; then
  echo "[seasonal_ens.conf] RUN=${RUN}"
  echo "[seasonal_ens.conf] SEASONAL_MODELS=${SEASONAL_MODELS}"
  echo "[seasonal_ens.conf] SEASONAL_OBS=${SEASONAL_OBS}"
  echo "[seasonal_ens.conf] SEASONAL_LEADS=${SEASONAL_LEADS}"
  echo "[seasonal_ens.conf] SEASONAL_DOMAINS=${SEASONAL_DOMAINS}"
fi
