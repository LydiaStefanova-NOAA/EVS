#!/bin/bash
# Common configuration for EVS seasonal component
# This file is sourced by jobs/JEVS_PREP_SEASONAL and other seasonal steps.

###############################################################################
# 1) Component identity
###############################################################################
export EVS_COMPONENT="seasonal"

###############################################################################
# 2) Data and cycle controls
###############################################################################
# Expected cycle hour(s) for seasonal processing
# (keep simple at first; expand as needed)
export SEASONAL_CYCLES="${SEASONAL_CYCLES:-00}"

# Start with monthly cadence semantics; can be expanded later.
export SEASONAL_FREQUENCY="${SEASONAL_FREQUENCY:-monthly}"

# Lead definitions (example placeholders)
# deterministic leads in months, ensemble/prob leads can reuse these initially
export SEASONAL_LEADS="${SEASONAL_LEADS:-1 2 3 4 5 6}"

###############################################################################
# 3) Domain/model/obs defaults
###############################################################################
# Keep broad placeholders to be narrowed in seasonal_det.conf / seasonal_ens.conf
export SEASONAL_DOMAINS="${SEASONAL_DOMAINS:-global conus}"

# Model and obs lists are intentionally generic here.
# Run-specific config should override with concrete systems.
export SEASONAL_MODELS="${SEASONAL_MODELS:-cfs}"
export SEASONAL_OBS="${SEASONAL_OBS:-era5 ghrsst}"

###############################################################################
# 4) Directory conventions
###############################################################################
# These can be overridden by environment or run-specific config.
export EVS_SEASONAL_WORK_SUBDIR="${EVS_SEASONAL_WORK_SUBDIR:-seasonal_work}"
export EVS_SEASONAL_STAGE_SUBDIR="${EVS_SEASONAL_STAGE_SUBDIR:-seasonal_stage}"
export EVS_SEASONAL_STAT_SUBDIR="${EVS_SEASONAL_STAT_SUBDIR:-seasonal_stats}"
export EVS_SEASONAL_PLOT_SUBDIR="${EVS_SEASONAL_PLOT_SUBDIR:-seasonal_plots}"

###############################################################################
# 5) METplus hooks (starter)
###############################################################################
# Point these at future metplus templates as they are added.
export EVS_SEASONAL_METPLUS_ROOT="${EVS_SEASONAL_METPLUS_ROOT:-${HOMEevs}/parm/metplus_config/seasonal}"
export EVS_SEASONAL_METPLUS_COMMON="${EVS_SEASONAL_METPLUS_COMMON:-${EVS_SEASONAL_METPLUS_ROOT}/common}"

###############################################################################
# 6) Runtime behavior switches
###############################################################################
# Fail fast by default in early development
export EVS_SEASONAL_STRICT="${EVS_SEASONAL_STRICT:-YES}"

# Produce verbose logs for initial bring-up
export EVS_SEASONAL_VERBOSE="${EVS_SEASONAL_VERBOSE:-YES}"

###############################################################################
# 7) Derived paths (useful defaults)
###############################################################################
# Respect externally-provided DATAROOT/COMOUT if already set.
export DATAROOT="${DATAROOT:-/tmp/${USER}/evs/${NET}/tmp}"
export COMOUT="${COMOUT:-/tmp/${USER}/evs/com/out/${NET}/${STEP}/${EVS_COMPONENT}/${RUN}}"

export EVS_SEASONAL_WORK_ROOT="${EVS_SEASONAL_WORK_ROOT:-${DATAROOT}/${EVS_SEASONAL_WORK_SUBDIR}}"
export EVS_SEASONAL_OUT_ROOT="${EVS_SEASONAL_OUT_ROOT:-${COMOUT}}"

###############################################################################
# 8) Basic sanity logging
###############################################################################
if [[ "${EVS_SEASONAL_VERBOSE}" == "YES" ]]; then
  echo "[seasonal_common] EVS_COMPONENT=${EVS_COMPONENT}"
  echo "[seasonal_common] SEASONAL_FREQUENCY=${SEASONAL_FREQUENCY}"
  echo "[seasonal_common] SEASONAL_LEADS=${SEASONAL_LEADS}"
  echo "[seasonal_common] SEASONAL_MODELS=${SEASONAL_MODELS}"
  echo "[seasonal_common] SEASONAL_OBS=${SEASONAL_OBS}"
  echo "[seasonal_common] SEASONAL_DOMAINS=${SEASONAL_DOMAINS}"
  echo "[seasonal_common] EVS_SEASONAL_WORK_ROOT=${EVS_SEASONAL_WORK_ROOT}"
  echo "[seasonal_common] EVS_SEASONAL_OUT_ROOT=${EVS_SEASONAL_OUT_ROOT}"
fi
