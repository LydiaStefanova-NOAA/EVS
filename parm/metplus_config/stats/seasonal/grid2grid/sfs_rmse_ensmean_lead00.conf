[config]
# ------------------------------------------------------------------------------
# Directories and Paths
# ------------------------------------------------------------------------------
MODELNAME = {ENV[MODELNAME]}
FCST_GRID_STAT_INPUT_DIR = {ENV[FCST_GRID_STAT_INPUT_DIR]}
OBS_GRID_STAT_INPUT_DIR = {ENV[OBS_GRID_STAT_INPUT_DIR]}
FCST_CLIMO_DIR = {ENV[FCST_CLIMO_DIR]}
OBS_CLIMO_DIR = {ENV[OBS_CLIMO_DIR]}

OUTPUT_BASE = {ENV[DATA]}/METplus/output
GRID_STAT_OUTPUT_DIR = {ENV[GRID_STAT_OUTPUT_DIR]}

# ------------------------------------------------------------------------------
# Filename Templates
# ------------------------------------------------------------------------------
# Ingests initialization corresponding to (valid - lead)
FCST_GRID_STAT_INPUT_TEMPLATE = inst.monthly.{init?fmt=%Y%m%d%H}.{valid?fmt=%Y%m}.grib.t00z.ensmean.nc
OBS_GRID_STAT_INPUT_TEMPLATE = core_hgt500_{valid?fmt=%Y%m}.nc

# Output filename differentiates each lead cycle by its distinct init timestamp
GRID_STAT_OUTPUT_TEMPLATE = grid_stat_{MODELNAME}_ensmean_HGT500_init{init?fmt=%Y%m%d}_valid{valid?fmt=%Y%m}

# ------------------------------------------------------------------------------
# Process & Timing Controls
# ------------------------------------------------------------------------------
PROCESS_LIST = GridStat

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H

# Piped in as YYYYMM (e.g., export TARGET_YYYYMM=202609)
# Appending '0100' anchors the evaluation to the 1st of the month at 00Z
VALID_BEG = {ENV[VDATE]}0100
VALID_END = {ENV[VDATE]}0100
VALID_INCREMENT = 1m

# List of forecast leads in months to evaluate against the target valid month.
# Extend or truncate this sequence to match your model's maximum forecast horizon.
# 0m = same-month init (Lead 0)
# 1m = run initialized 1 month prior (Lead 1)
# 2m = run initialized 2 months prior (Lead 2), etc.
#LEAD_SEQ = 0m, 1m, 2m, 3m, 4m, 5m, 6m, 7m, 8m, 9m
LEAD_SEQ = 0m

# ------------------------------------------------------------------------------
# Grid-Stat Tool Options
# ------------------------------------------------------------------------------
GRID_STAT_MASK_GRID = FULL
GRID_STAT_GRID_WEIGHT_FLAG = COS_LAT

GRID_STAT_OUTPUT_FLAG_CNT = BOTH
GRID_STAT_OUTPUT_FLAG_CTS = NONE
GRID_STAT_OUTPUT_FLAG_SL1L2 = NONE
GRID_STAT_OUTPUT_FLAG_SAL1L2 = BOTH

# Regrid forecast to CORe Gaussian verification grid
GRID_STAT_REGRID_TO_GRID = OBS
GRID_STAT_REGRID_METHOD = BILIN
GRID_STAT_REGRID_WIDTH = 2

# ------------------------------------------------------------------------------
# Field Configurations
# ------------------------------------------------------------------------------
FCST_VAR1_NAME = HGT_500mb
FCST_VAR1_LEVELS = "(0,*,*)"
FCST_VAR1_OPTIONS = file_type = NETCDF_NCCF; set_attr_valid = "{valid?fmt=%Y%m%d_%H%M%S}";

OBS_VAR1_NAME = HGT_500mb
OBS_VAR1_LEVELS = "(0,*,*)"
OBS_VAR1_OPTIONS = set_attr_valid = "{valid?fmt=%Y%m%d_%H%M%S}";

# ------------------------------------------------------------------------------
# Climatology Overrides
# ------------------------------------------------------------------------------
GRID_STAT_MET_CONFIG_OVERRIDES = fcst = {
    climo_mean = {
      file_type = NETCDF_NCCF;
      file_name = [ "{FCST_CLIMO_DIR}/{MODELNAME}_init{init?fmt=%m}_clim_1991-2020_lead00.nc" ];
      field = [ { name = "HGT_500mb_mean"; level = "(0,*,*)"; set_attr_valid = "{valid?fmt=%Y%m%d_%H%M%S}"; } ];
      time_interp_method = NEAREST;
      day_interval = NA;
      hour_interval = NA;
    };
  };
  obs = {
    climo_mean = {
      file_type = NETCDF_NCCF;
      file_name = [ "{OBS_CLIMO_DIR}/core_hgt500_clim_{valid?fmt=%m}.nc" ];
      field = [ { name = "HGT_500mb_mean"; level = "(*,*)"; set_attr_valid = "{valid?fmt=%Y%m%d_%H%M%S}"; } ];
      time_interp_method = NEAREST;
      day_interval = NA;
      hour_interval = NA;
    };
  };
