[config]
# ------------------------------------------------------------------------------
# Names, Directories and Paths
# ------------------------------------------------------------------------------
MODEL = {ENV[MODELNAME]}
OBTYPE = {ENV[OBSNAME]}
VARNAME = {ENV[VARNAME]}
FCST_STREAM = {ENV[FCST_STREAM]}
OBS_PREFIX = {ENV[OBS_PREFIX]}
LEAD_PAD = {ENV[LEAD_PAD]}
LEAD_HHMMSS = {ENV[LEAD_HHMMSS]}

FCST_GRID_STAT_INPUT_DIR = {ENV[FCST_GRID_STAT_INPUT_DIR]}
OBS_GRID_STAT_INPUT_DIR = {ENV[OBS_GRID_STAT_INPUT_DIR]}
FCST_CLIMO_DIR = {ENV[FCST_CLIMO_DIR]}
OBS_CLIMO_DIR = {ENV[OBS_CLIMO_DIR]}

OUTPUT_BASE = {ENV[METPLUS_OUTPUT_BASE]}
GRID_STAT_OUTPUT_DIR = {ENV[GRID_STAT_OUTPUT_DIR]}/{ENV[VARNAME]}_lead{ENV[LEAD_PAD]}

LOG_METPLUS_VERBOSITY = 2

# ------------------------------------------------------------------------------
# Filename Templates
# ------------------------------------------------------------------------------
FCST_GRID_STAT_INPUT_TEMPLATE = {ENV[RUN]}.{valid?fmt=%Y%m}/{MODEL}/ens/{FCST_STREAM}.monthly.{init?fmt=%Y%m%d%H}.{valid?fmt=%Y%m}.grib.t00z.ensmean.nc
OBS_GRID_STAT_INPUT_TEMPLATE = {ENV[RUN]}.{valid?fmt=%Y%m}/obs/{OBTYPE}/{OBS_PREFIX}_{valid?fmt=%Y%m}.nc

GRID_STAT_OUTPUT_TEMPLATE =

# ------------------------------------------------------------------------------
# Process & Timing Controls
# ------------------------------------------------------------------------------
PROCESS_LIST = GridStat

LOOP_BY = VALID
VALID_TIME_FMT = %Y%m%d%H

VALID_BEG = {ENV[VDATE]}0100
VALID_END = {ENV[VDATE]}0100
VALID_INCREMENT = 1m

LEAD_SEQ = {ENV[LEAD_SEQ]}

# ------------------------------------------------------------------------------
# Grid-Stat Tool Options
# ------------------------------------------------------------------------------
GRID_STAT_DESC = {ENV[VARNAME]}_lead{ENV[LEAD_PAD]}
GRID_STAT_MASK_GRID = FULL
GRID_STAT_GRID_WEIGHT_FLAG = COS_LAT

GRID_STAT_OUTPUT_FLAG_CNT = STAT
GRID_STAT_OUTPUT_FLAG_CTS = NONE
GRID_STAT_OUTPUT_FLAG_SL1L2 = NONE
GRID_STAT_OUTPUT_FLAG_SAL1L2 = STAT

# Regrid forecast to observation verification grid
GRID_STAT_REGRID_TO_GRID = OBS
GRID_STAT_REGRID_METHOD = BILIN
GRID_STAT_REGRID_WIDTH = 2

# ------------------------------------------------------------------------------
# Field Configurations
# ------------------------------------------------------------------------------
FCST_VAR1_NAME = {ENV[FCST_VAR]}
FCST_VAR1_LEVELS = "{ENV[FCST_LEVEL]}"
FCST_VAR1_OPTIONS = file_type = NETCDF_NCCF; set_attr_init = "{init?fmt=%Y%m%d_%H%M%S}"; set_attr_valid = "{valid?fmt=%Y%m%d_%H%M%S}"; set_attr_lead = "{LEAD_HHMMSS}";

OBS_VAR1_NAME = {ENV[OBS_VAR]}
OBS_VAR1_LEVELS = "{ENV[OBS_LEVEL]}"
OBS_VAR1_OPTIONS = set_attr_valid = "{valid?fmt=%Y%m%d_%H%M%S}";

# ------------------------------------------------------------------------------
# Climatology & NetCDF Pairs Overrides
# ------------------------------------------------------------------------------
GRID_STAT_MET_CONFIG_OVERRIDES = nc_pairs_flag = FALSE;
  fcst = {
    climo_mean = {
      file_type = NETCDF_NCCF;
      file_name = [ "{FCST_CLIMO_DIR}/{MODEL}_init{init?fmt=%2m}_clim_1991-2020_lead{LEAD_PAD}.nc" ];
      field = [ { name = "{ENV[FCST_VAR]}_mean"; level = "{ENV[FCST_LEVEL]}"; set_attr_valid = "{valid?fmt=%Y%m%d_%H%M%S}"; } ];
      time_interp_method = NEAREST;
      day_interval = NA;
      hour_interval = NA;
    };
  };
  obs = {
    climo_mean = {
      file_type = NETCDF_NCCF;
      file_name = [ "{OBS_CLIMO_DIR}/{OBTYPE}_all_clim_{valid?fmt=%m}.nc" ];
      field = [ { name = "{ENV[OBS_VAR]}_mean"; level = "{ENV[OBS_CLIMO_LEVEL]}"; set_attr_valid = "{valid?fmt=%Y%m%d_%H%M%S}"; } ];
      time_interp_method = NEAREST;
      day_interval = NA;
      hour_interval = NA;
    };
  };
