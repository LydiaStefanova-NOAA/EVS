////////////////////////////////////////////////////////////////////////////////
//
// EnsembleStat_fcstSEASONAL_obsANALYSIS.conf
// Minimal probabilistic seasonal EnsembleStat template
//
////////////////////////////////////////////////////////////////////////////////

[config]
ENS_STAT_INPUT_DIR = {FCST_DIR}
ENS_STAT_OBS_INPUT_DIR = {OBS_DIR}

# Starter templates. Update to your actual ensemble file naming and member list.
ENS_STAT_INPUT_TEMPLATE = {init?fmt=%Y%m%d}/{init?fmt=%H}/ens_seasonal_{ens_member}_f{lead?fmt=%3H}.grib2
ENS_STAT_OBS_INPUT_TEMPLATE = {valid?fmt=%Y%m%d}/{valid?fmt=%H}/obs_analysis.grib2

# Members can be overridden at runtime with ENS_MEMBER_LIST
ENS_MEMBER_LIST = {env[ENS_MEMBER_LIST]:-mem001,mem002,mem003,mem004,mem005}

# Seasonal leads represented in coarse hours (starter)
LEAD_SEQ = 720,1440,2160,2880,3600,4320

# Variable and level
ENS_VAR1_NAME = TMP
ENS_VAR1_LEVELS = Z2
OBS_VAR1_NAME = TMP
OBS_VAR1_LEVELS = Z2

# Probabilistic thresholds (starter)
ENS_STAT_FCST_THRESH = >=273.15
ENS_STAT_OBS_THRESH = >=273.15

# Output
ENS_STAT_OUTPUT_DIR = {OUTPUT_BASE}/ens/ensemble_stat/{init?fmt=%Y%m%d%H}
ENS_STAT_OUTPUT_TEMPLATE = ensemble_stat_seasonal_TMP_Z2_{lead?fmt=%3H}L.stat

# Use shared mask
ENS_STAT_VX_MASK = {VX_MASK}
