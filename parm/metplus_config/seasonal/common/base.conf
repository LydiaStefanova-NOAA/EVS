////////////////////////////////////////////////////////////////////////////////
//
// base.conf - shared METplus behavior for seasonal component
//
////////////////////////////////////////////////////////////////////////////////

[config]
LOOP_BY = VALID
VERBOSITY = 2

# Seasonal starter cadence: monthly-style valid times
# Replace with your true seasonal valid schedule as needed.
VALID_BEG = {env[PDY]}_{env[cyc]}0000
VALID_END = {env[PDY]}_{env[cyc]}0000
VALID_INCREMENT = 24H

# Output
OUTPUT_BASE = {env[METPLUS_OUT_DIR]}
LOG_METPLUS = {OUTPUT_BASE}/logs
LOG_LEVEL = INFO

# Regridding defaults for starter use
REGRID_TO_GRID = FCST
INTERP_METHOD = NEAREST
