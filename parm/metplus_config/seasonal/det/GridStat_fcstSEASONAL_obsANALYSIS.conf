////////////////////////////////////////////////////////////////////////////////
//
// GridStat_fcstSEASONAL_obsANALYSIS.conf
// Minimal deterministic seasonal GridStat template
//
////////////////////////////////////////////////////////////////////////////////

[config]
# Filename templates (starter placeholders - update to your real naming)
FCST_GRID_STAT_INPUT_DIR = {FCST_DIR}
OBS_GRID_STAT_INPUT_DIR = {OBS_DIR}

FCST_GRID_STAT_INPUT_TEMPLATE = {init?fmt=%Y%m%d}/{init?fmt=%H}/fcst_seasonal_f{lead?fmt=%3H}.grib2
OBS_GRID_STAT_INPUT_TEMPLATE  = {valid?fmt=%Y%m%d}/{valid?fmt=%H}/obs_analysis.grib2

# Leads: seasonal-scale starter represented as coarse hours
# Replace with proper monthly/seasonal lead mapping for your data.
LEAD_SEQ = 720,1440,2160,2880,3600,4320

# Variable and level
FCST_VAR1_NAME = TMP
FCST_VAR1_LEVELS = Z2
OBS_VAR1_NAME = TMP
OBS_VAR1_LEVELS = Z2

# GridStat output
GRID_STAT_OUTPUT_DIR = {OUTPUT_BASE}/det/grid_stat/{init?fmt=%Y%m%d%H}
GRID_STAT_OUTPUT_TEMPLATE = grid_stat_seasonal_TMP_Z2_{lead?fmt=%3H}L.stat

# Optional thresholds (starter)
GRID_STAT_FCST_THRESH = >=273.15
GRID_STAT_OBS_THRESH = >=273.15

# Use shared mask
GRID_STAT_VX_MASK = {VX_MASK}
